# The hawk-failover bundle patch: mounts the provider-failover plugin row
# (agent/request + agent/request-error waterfall listeners). Declared through
# `dsh.bundle.patch` in package.json, so
# `dsh plugin --profile web add link:<this dir>` automatically appends this
# package to the profile's `dsh.profile.bundles` layer stack and the row
# mounts on the next boot — no manual profile cordis.patch.yml edit needed.
# `id` is the cordis plugin id (hawk-failover, also the settings.yaml
# namespace); `name` is the package specifier the loader resolves (the npm
# package name).
- insert:
    - id: hawk-failover
      name: "dsh-llm-hawk-failover"
